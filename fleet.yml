schema_version: 1
owner: wgross19
default_branch: main
awesome_unraid_repository: wgross19/awesome-unraid
dashboard:
  destination_repos:
    awesome-unraid:
      github_repo: wgross19/awesome-unraid
      public: true
      role: catalog destination
      description: Community Applications catalog for validated Unraid App Factory source changes.
      next_action: Validate source app state before catalog synchronization.
defaults:
  python_version: "3.13"
  publish_platforms: linux/amd64,linux/arm64
  integration_pytest_args: tests/integration -m integration --timeout=90
  non_release_paths:
    - .aio-fleet.yml
    - README.md
    - AGENTS.md
    - docs/**
    - pyproject.toml
    - tests/**
    - .github/**
    - .trunk/**
  release_transaction:
    autopilot: false
    checkout_policy: standard
    publish_policy: central-control
repos:
  gbrain-aio:
    path: ../gbrain-vanilla-aio
    github_repo: wgross19/gbrain-aio
    public: true
    workflow_name: CI / GBrain AIO
    app_slug: gbrain-aio
    image_name: dub19/gbrain-aio
    docker_cache_scope: gbrain-aio-image
    pytest_image_tag: gbrain-aio:pytest
    unit_pytest_args: tests/test_dockerfile_policy.py
    publish_profile: changelog-version
    release_name: GBrain AIO
    upstream_name: GBrain
    image_description: Unraid-first AIO wrapper image for vanilla GBrain (Postgres, Caddy, worker)
    catalog_published: true
    xml_paths:
      - gbrain-aio.xml
    catalog_assets:
      - source: gbrain-aio.xml
        target: gbrain-aio.xml
      - source: assets/app-icon.png
        target: icons/gbrain.png
    upstream_monitor:
      - component: gbrain
        name: GBrain
        source: github-tags
        repo: garrytan/gbrain
        dockerfile: Dockerfile
        version_key: UPSTREAM_VERSION
        commit_key: GBRAIN_GIT_SHA
        stable_only: true
        strategy: pr
        release_notes_url: https://github.com/garrytan/gbrain/releases
      - component: bun
        name: Bun
        source: github-releases
        repo: oven-sh/bun
        image: oven/bun
        digest_source: dockerhub
        dockerfile: Dockerfile
        version_key: BUN_VERSION
        digest_key: BUN_DIGEST
        version_strip_prefix: bun-v
        stable_only: true
        strategy: notify
        release_notes_url: https://github.com/oven-sh/bun/releases
      - component: caddy
        name: Caddy
        source: github-tags
        repo: caddyserver/caddy
        dockerfile: Dockerfile
        version_key: CADDY_VERSION
        stable_only: true
        strategy: notify
        release_notes_url: https://github.com/caddyserver/caddy/releases
  honcho-aio:
    path: ../honcho-aio
    github_repo: wgross19/honcho-aio
    public: true
    app_slug: honcho-aio
    image_name: dub19/honcho-aio
    docker_cache_scope: honcho-aio-image
    pytest_image_tag: honcho-aio:pytest
    publish_profile: changelog-version
    release_name: Honcho AIO
    upstream_name: Honcho
    upstream_version_key: HONCHO_VERSION
    upstream_monitor:
      - component: honcho
        name: Honcho
        source: github-tags
        repo: plastic-labs/honcho
        version_key: HONCHO_VERSION
        stable_only: true
        strategy: pr
        release_notes_url: https://github.com/plastic-labs/honcho/releases
    catalog_published: true
    xml_paths:
      - honcho-aio.xml
    catalog_assets:
      - source: honcho-aio.xml
        target: honcho-aio.xml
      - source: assets/app-icon.png
        target: icons/honcho.png
  fastcrw-aio:
    path: ../fastcrw-aio
    github_repo: wgross19/fastcrw-aio
    public: true
    app_slug: fastcrw-aio
    image_name: dub19/fastcrw-aio
    docker_cache_scope: fastcrw-aio-image
    pytest_image_tag: fastcrw-aio:pytest
    publish_platforms: linux/amd64
    unit_pytest_args: tests -m "not integration"
    integration_pytest_args: tests/integration -m integration --timeout=600
    publish_profile: changelog-version
    release_name: fastcrw AIO
    upstream_name: crw
    upstream_version_key: CRW_VERSION
    image_description: Unraid-first AIO wrapper image for crw (crw-server, LightPanda)
    upstream_monitor:
      - component: crw
        name: crw
        source: github-tags
        repo: us/crw
        dockerfile: Dockerfile
        version_key: CRW_VERSION
        stable_only: true
        strategy: notify
        release_notes_url: https://github.com/us/crw/releases
    catalog_published: true
    xml_paths:
      - fastcrw-aio.xml
    catalog_assets:
      - source: fastcrw-aio.xml
        target: fastcrw-aio.xml
      - source: assets/app-icon.png
        target: icons/fastcrw-aio.png
