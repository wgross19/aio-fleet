schema_version: 1
owner: wgross19
default_branch: main
awesome_unraid_repository: wgross19/awesome-unraid
dashboard:
  destination_repos:
    awesome-unraid:
      github_repo: wgross19/awesome-unraid
      public: true
      role: catalog destination
      description: Community Applications catalog for validated Unraid App Factory source changes.
      next_action: Validate source app state before catalog synchronization.
defaults:
  python_version: "3.13"
  publish_platforms: linux/amd64,linux/arm64
  integration_pytest_args: tests/integration -m integration
  non_release_paths:
    - .aio-fleet.yml
    - README.md
    - AGENTS.md
    - docs/**
    - pyproject.toml
    - tests/**
    - .github/**
    - .trunk/**
  release_transaction:
    autopilot: false
    checkout_policy: standard
    publish_policy: central-control
repos:
  gbrain-aio:
    path: ../gbrain-vanilla-aio
    github_repo: wgross19/gbrain-vanilla-aio
    public: true
    workflow_name: CI / GBrain AIO
    app_slug: gbrain-aio
    image_name: wgross19/gbrain-aio
    docker_cache_scope: gbrain-aio-image
    pytest_image_tag: gbrain-aio:pytest
    unit_pytest_args: tests/test_dockerfile_policy.py
    publish_profile: changelog-version
    release_name: GBrain AIO
    upstream_name: GBrain
    image_description: Unraid-first AIO wrapper image for vanilla GBrain (Postgres, Caddy, worker)
    catalog_published: false
    xml_paths:
      - gbrain-aio.xml
    catalog_assets:
      - source: gbrain-aio.xml
        target: gbrain-aio.xml
      - source: assets/app-icon.png
        target: icons/gbrain.png
